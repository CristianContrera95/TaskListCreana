[project]
name = "tasklistapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi[all]>=0.116.1",
    "passlib>=1.7.4",
    "psycopg>=3.2.9",
    "pydantic-settings>=2.10.1",
    "python-jose>=3.5.0",
    "sqlmodel>=0.0.24",
    "strawberry-graphql>=0.278.1",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.3.0",
    "isort>=6.0.1",
    "pylint>=3.3.8",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
